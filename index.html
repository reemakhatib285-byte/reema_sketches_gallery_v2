<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch Gallery — Reema</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--bg2:#0d1120;--surface:#111827;--surface2:#1a2235;--surface3:#212e45;
  --border:rgba(148,163,184,0.10);--border2:rgba(148,163,184,0.22);--border3:rgba(148,163,184,0.38);
  --text1:#f0f4ff;--text2:#94a3b8;--text3:#475569;
  --accent:#7eb8f7;--accent-d:#3b82f6;--accent-bg:rgba(126,184,247,0.08);
  --gold:#f0c060;--green:#6ee7b7;--radius:14px;--glow:rgba(126,184,247,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text1);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 15%,rgba(126,184,247,0.05) 0%,transparent 50%),radial-gradient(ellipse at 85% 85%,rgba(110,231,183,0.04) 0%,transparent 55%);pointer-events:none;z-index:0;}
.container{max-width:1100px;margin:0 auto;padding:0 22px 90px;position:relative;z-index:1;}
.topnav{display:flex;justify-content:flex-start;padding:22px 0 0;}
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--text2);text-decoration:none;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.04em;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 14px;transition:border-color .2s,color .2s;}
.back-link:hover{border-color:var(--border2);color:var(--text1);}
header{text-align:center;padding:34px 0 30px;}
.header-badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent-bg);border:1px solid var(--border2);border-radius:100px;padding:6px 16px;font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:18px;}
.header-badge::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);font-weight:400;}
h1 em{font-style:italic;color:var(--accent);}
.header-sub{font-family:'Space Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:0.06em;margin-top:9px;}
.stats{display:flex;justify-content:center;gap:12px;margin:24px 0 30px;flex-wrap:wrap;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 24px;text-align:center;min-width:100px;}
.stat-num{font-family:'Space Mono',monospace;font-size:1.6rem;font-weight:700;color:var(--accent);display:block;line-height:1;}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-top:5px;display:block;font-family:'Space Mono',monospace;}
.search-wrap{position:relative;margin-bottom:28px;}
.search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
#searchInput{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px 13px 42px;color:var(--text1);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;}
#searchInput:focus{border-color:var(--border2);}
#searchInput::placeholder{color:var(--text3);}
.subject-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:border-color .2s;}
.subject-card:hover{border-color:var(--border2);}
.subject-header{display:flex;align-items:center;gap:13px;padding:17px 18px;cursor:pointer;user-select:none;}
.subject-icon{width:40px;height:40px;background:var(--surface2);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.subject-name{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;flex:1;}
.topic-count{font-family:'Space Mono',monospace;font-size:10px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--border2);border-radius:6px;padding:3px 9px;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
.chevron{color:var(--text3);transition:transform .25s;flex-shrink:0;}
.subject-card.open .chevron{transform:rotate(180deg);}
.subject-body{display:none;padding:0 18px 14px;border-top:1px solid var(--border);}
.subject-card.open .subject-body{display:block;}
.topic-block{margin-top:16px;}
.topic-title{font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.topic-title::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.6;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.scene{background:var(--surface2);border:1px solid var(--border);border-radius:11px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .2s;position:relative;}
.scene:hover{transform:translateY(-3px);border-color:var(--border3);}
.scene img{width:100%;height:118px;object-fit:cover;display:block;background:var(--surface3);}
.scene-cap{font-size:11px;color:var(--text2);padding:7px 9px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px;}
.no-results{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;display:none;}
footer{text-align:center;padding:44px 0 0;font-family:'Space Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:0.05em;}
footer a{color:var(--text2);text-decoration:none;}
footer a:hover{color:var(--accent);}
.loading{text-align:center;padding:80px 20px;color:var(--text3);font-family:'Space Mono',monospace;font-size:13px;}
/* lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(4,6,11,0.94);z-index:300;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px);}
.lb.show{display:flex;}
.lb img{max-width:92vw;max-height:80vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,0.6);object-fit:contain;}
.lb-cap{color:var(--text1);font-family:'DM Sans',sans-serif;font-size:14px;margin-top:16px;max-width:80vw;text-align:center;line-height:1.4;padding:0 20px;}
.lb-meta{color:var(--text3);font-family:'Space Mono',monospace;font-size:11px;margin-top:6px;letter-spacing:0.05em;}
.lb-close{position:absolute;top:20px;right:24px;background:var(--surface);border:1px solid var(--border2);color:var(--text1);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lb-close:hover{border-color:var(--accent);}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:var(--surface);border:1px solid var(--border2);color:var(--text1);width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s;}
.lb-nav:hover{border-color:var(--accent);}
.lb-prev{left:18px;} .lb-next{right:18px;}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}.scene img{height:96px;}.lb-nav{width:40px;height:40px;}}
/* compare */
.controls{display:flex;justify-content:flex-end;margin:-14px 0 22px;}
.btn-compare{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 15px;color:var(--text2);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.04em;cursor:pointer;transition:border-color .2s,color .2s;}
.btn-compare:hover{border-color:var(--border2);color:var(--text1);}
.btn-compare.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.scene{position:relative;}
.scene .sel-badge{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;background:rgba(8,11,18,0.7);border:1.5px solid var(--border3);color:transparent;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:2;}
body.compare-mode .scene{cursor:copy;}
body.compare-mode .scene .sel-badge{display:flex;}
.scene.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
.scene.sel .sel-badge{background:var(--accent);border-color:var(--accent);color:#08111f;}
.cmp-tray{position:fixed;left:0;right:0;bottom:0;z-index:250;background:rgba(13,17,32,0.96);border-top:1px solid var(--border2);backdrop-filter:blur(8px);padding:12px 16px;display:none;align-items:center;gap:12px;}
.cmp-tray.show{display:flex;}
.cmp-tray-thumbs{display:flex;gap:8px;flex:1;overflow-x:auto;}
.cmp-thumb{position:relative;width:54px;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--border2);flex-shrink:0;}
.cmp-thumb img{width:100%;height:100%;object-fit:cover;}
.cmp-thumb button{position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,0.7);border:none;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.cmp-hint{font-family:'Space Mono',monospace;font-size:11px;color:var(--text3);flex-shrink:0;}
.cmp-tray-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.btn-cmp-open{background:var(--accent);color:#08111f;border:none;border-radius:9px;padding:10px 16px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn-cmp-open:disabled{opacity:.4;cursor:not-allowed;}
.btn-cmp-clear{background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:9px;padding:10px 14px;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;white-space:nowrap;}
.cmp{display:none;position:fixed;inset:0;z-index:320;background:rgba(4,6,11,0.97);backdrop-filter:blur(4px);flex-direction:column;}
.cmp.show{display:flex;}
.cmp-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.cmp-bar span{font-family:'Space Mono',monospace;font-size:12px;color:var(--text2);letter-spacing:0.05em;}
.cmp-bar button{background:var(--surface);border:1px solid var(--border2);color:var(--text1);border-radius:8px;width:36px;height:36px;font-size:17px;cursor:pointer;}
.cmp-grid{flex:1;display:grid;gap:2px;padding:2px;min-height:0;}
.cmp-grid.n1{grid-template-columns:1fr;}
.cmp-grid.n2{grid-template-columns:1fr 1fr;}
.cmp-grid.n3{grid-template-columns:1fr 1fr 1fr;}
.cmp-grid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.cmp-panel{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:0;}
.cmp-panel img{max-width:100%;max-height:100%;object-fit:contain;display:block;cursor:zoom-in;}
.cmp-panel.zoom{align-items:flex-start;justify-content:flex-start;}
.cmp-panel.zoom img{max-width:none;max-height:none;width:auto;cursor:zoom-out;}
.cmp-ptools{position:absolute;top:6px;left:6px;right:6px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:2;pointer-events:none;}
.cmp-pname{font-size:11px;color:var(--text1);background:rgba(8,11,18,0.8);border:1px solid var(--border);border-radius:6px;padding:4px 8px;max-width:78%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:auto;}
.cmp-pclose{width:24px;height:24px;border-radius:50%;background:rgba(8,11,18,0.85);border:1px solid var(--border2);color:#fff;font-size:12px;cursor:pointer;flex-shrink:0;pointer-events:auto;}
@media(max-width:700px){.cmp-grid.n3,.cmp-grid.n4{grid-template-columns:1fr 1fr;grid-template-rows:auto;}.cmp-grid{overflow:auto;}.cmp-panel{min-height:42vh;}}
</style>
</head>
<body>
<div class="container">
  <div class="topnav">
    <a class="back-link" href="https://reemakhatib285-byte.github.io/boards-study-hub/">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Study Hub
    </a>
  </div>
  <header>
    <div class="header-badge">Stage א · Internal Medicine · 2026</div>
    <h1>Sketch <em>Gallery</em></h1>
    <p class="header-sub">Reema · visual mnemonics, all in one place</p>
  </header>
  <div class="stats">
    <div class="stat"><span class="stat-num" id="totalScenes">—</span><span class="stat-label">Scenes</span></div>
    <div class="stat"><span class="stat-num" id="totalSubjects">—</span><span class="stat-label">Subjects</span></div>
    <div class="stat"><span class="stat-num">A</span><span class="stat-label">Stage</span></div>
  </div>
  <div class="search-wrap">
    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search scenes, topics, subjects...">
  </div>
  <div class="controls">
    <button class="btn-compare" id="compareBtn" onclick="toggleCompareMode()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg>
      Compare
    </button>
  </div>
  <div id="subjectsContainer"></div>
  <div class="loading" id="loading">Loading scenes…</div>
  <div class="no-results" id="noResults">No scenes match your search.</div>
  <footer>Sketch Gallery · Stage A Internal Medicine · 2026 · <a href="https://reemakhatib285-byte.github.io/boards-study-hub/">← Study Hub</a></footer>
</div>

<div class="cmp-tray" id="cmpTray">
  <div class="cmp-tray-thumbs" id="cmpThumbs"></div>
  <div class="cmp-hint" id="cmpHint">Pick up to 4</div>
  <div class="cmp-tray-actions">
    <button class="btn-cmp-clear" onclick="clearCompare()">Clear</button>
    <button class="btn-cmp-open" id="cmpOpenBtn" onclick="openCompare()" disabled>Compare (0)</button>
  </div>
</div>

<div class="cmp" id="cmpView">
  <div class="cmp-bar">
    <span id="cmpBarLabel">Compare</span>
    <button onclick="closeCompare()" aria-label="Close">✕</button>
  </div>
  <div class="cmp-grid" id="cmpGrid"></div>
</div>

<div class="lb" id="lightbox">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <button class="lb-nav lb-prev" onclick="navLb(-1,event)">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" onclick="navLb(1,event)">›</button>
  <div class="lb-cap" id="lbCap"></div>
  <div class="lb-meta" id="lbMeta"></div>
</div>

<script>
let DATA = {subjects:[]};
let FLAT = [];        // flattened scenes for lightbox navigation
let lbIndex = -1;
let openSubjects = new Set();
let compareMode = false;
const selected = new Map();   // file -> {file,name,subject,topic}
const MAX_CMP = 4;

async function init(){
  try{
    const res = await fetch('manifest.json?cb='+Date.now());
    DATA = await res.json();
  }catch(e){
    document.getElementById('loading').textContent = 'Could not load gallery data.';
    return;
  }
  document.getElementById('loading').style.display='none';
  document.getElementById('totalScenes').textContent = DATA.total || 0;
  document.getElementById('totalSubjects').textContent = (DATA.subjects||[]).length;
  if(DATA.subjects.length) openSubjects.add(DATA.subjects[0].id);
  const q=new URLSearchParams(location.search).get('q')||'';
  if(q){ document.getElementById('searchInput').value=q; }
  render(q);
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(filter){
  const f = filter.trim().toLowerCase();
  const c = document.getElementById('subjectsContainer');
  c.innerHTML='';
  FLAT = [];
  let visible=0;
  DATA.subjects.forEach(subj=>{
    // build filtered topic list
    const topics = subj.topics.map(t=>{
      const scenes = f ? t.scenes.filter(s=>
        s.name.toLowerCase().includes(f) || t.name.toLowerCase().includes(f) || subj.name.toLowerCase().includes(f)
      ) : t.scenes;
      return {...t, scenes};
    }).filter(t=>t.scenes.length);
    if(!topics.length) return;
    visible++;
    const total = topics.reduce((n,t)=>n+t.scenes.length,0);
    const isOpen = openSubjects.has(subj.id) || !!f;
    const card=document.createElement('div');
    card.className='subject-card'+(isOpen?' open':'');
    let body='';
    topics.forEach(t=>{
      const showTopicTitle = !(subj.topics.length===1 && t.name==='General');
      body += showTopicTitle ? `<div class="topic-block"><div class="topic-title">${esc(t.name)}</div><div class="grid">` : `<div class="topic-block"><div class="grid">`;
      t.scenes.forEach(s=>{
        const gi = FLAT.length;
        FLAT.push({file:s.file,name:s.name,subject:subj.name,topic:t.name});
        const selCls = selected.has(s.file) ? ' sel' : '';
        body += `<div class="scene${selCls}" data-file="${esc(s.file)}" onclick="onSceneClick(${gi},this)"><span class="sel-badge">✓</span><img loading="lazy" src="${esc(s.file)}" alt="${esc(s.name)}"><div class="scene-cap">${esc(s.name)}</div></div>`;
      });
      body += `</div></div>`;
    });
    card.innerHTML = `
      <div class="subject-header" onclick="toggle('${subj.id}')">
        <div class="subject-icon">${subj.icon||'📚'}</div>
        <span class="subject-name">${esc(subj.name)}</span>
        <span class="topic-count">${total} SCENE${total!==1?'S':''}</span>
        <svg class="chevron" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="subject-body">${body}</div>`;
    c.appendChild(card);
  });
  document.getElementById('noResults').style.display = visible? 'none':'block';
}

function toggle(id){
  openSubjects.has(id)?openSubjects.delete(id):openSubjects.add(id);
  render(document.getElementById('searchInput').value);
}

function openLb(i){
  lbIndex=i;
  const s=FLAT[i]; if(!s) return;
  document.getElementById('lbImg').src=s.file;
  document.getElementById('lbCap').textContent=s.name;
  document.getElementById('lbMeta').textContent=`${s.subject} · ${s.topic}  —  ${i+1}/${FLAT.length}`;
  document.getElementById('lightbox').classList.add('show');
}
function closeLb(){document.getElementById('lightbox').classList.remove('show');}
function navLb(d,e){if(e)e.stopPropagation();if(!FLAT.length)return;lbIndex=(lbIndex+d+FLAT.length)%FLAT.length;openLb(lbIndex);}

/* ---- compare ---- */
function cssEsc(s){return (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/["\\]/g,'\\$&');}
function onSceneClick(i,el){ compareMode ? toggleSelect(i,el) : openLb(i); }
function toggleCompareMode(){
  compareMode=!compareMode;
  document.body.classList.toggle('compare-mode',compareMode);
  document.getElementById('compareBtn').classList.toggle('active',compareMode);
  updateTray();
}
function toggleSelect(i,el){
  const s=FLAT[i]; if(!s) return;
  if(selected.has(s.file)){ selected.delete(s.file); if(el)el.classList.remove('sel'); }
  else{
    if(selected.size>=MAX_CMP){ flashHint('Max 4 — remove one first'); return; }
    selected.set(s.file,{file:s.file,name:s.name,subject:s.subject,topic:s.topic});
    if(el)el.classList.add('sel');
  }
  updateTray();
}
function flashHint(msg){
  const h=document.getElementById('cmpHint'); h.textContent=msg; h.style.color='#fca5a5';
  setTimeout(()=>{h.textContent=selected.size?`${selected.size}/4 selected`:'Pick up to 4';h.style.color='';},1500);
}
function updateTray(){
  const tray=document.getElementById('cmpTray'), thumbs=document.getElementById('cmpThumbs');
  const openBtn=document.getElementById('cmpOpenBtn'), hint=document.getElementById('cmpHint');
  tray.classList.toggle('show',compareMode);
  thumbs.innerHTML='';
  selected.forEach(s=>{
    const d=document.createElement('div'); d.className='cmp-thumb';
    d.innerHTML=`<img src="${esc(s.file)}" alt=""><button onclick="removeSel('${esc(s.file)}')">✕</button>`;
    thumbs.appendChild(d);
  });
  openBtn.textContent=`Compare (${selected.size})`;
  openBtn.disabled=selected.size<2;
  hint.textContent=selected.size?`${selected.size}/4 selected`:'Pick up to 4';
  hint.style.color='';
}
function removeSel(file){
  selected.delete(file);
  const el=document.querySelector(`.scene[data-file="${cssEsc(file)}"]`);
  if(el)el.classList.remove('sel');
  updateTray();
  if(document.getElementById('cmpView').classList.contains('show')){
    selected.size<2 ? closeCompare() : openCompare();
  }
}
function clearCompare(){
  selected.clear();
  document.querySelectorAll('.scene.sel').forEach(e=>e.classList.remove('sel'));
  updateTray();
}
function openCompare(){
  if(selected.size<2) return;
  const items=[...selected.values()];
  const grid=document.getElementById('cmpGrid');
  grid.className='cmp-grid n'+items.length;
  grid.innerHTML=items.map(s=>`
    <div class="cmp-panel" onclick="if(event.target.tagName==='IMG')this.classList.toggle('zoom')">
      <div class="cmp-ptools"><span class="cmp-pname">${esc(s.name)}</span><button class="cmp-pclose" onclick="event.stopPropagation();removeSel('${esc(s.file)}')">✕</button></div>
      <img src="${esc(s.file)}" alt="${esc(s.name)}">
    </div>`).join('');
  document.getElementById('cmpBarLabel').textContent=`Comparing ${items.length} scenes · tap an image to zoom`;
  document.getElementById('cmpView').classList.add('show');
}
function closeCompare(){ document.getElementById('cmpView').classList.remove('show'); }

document.getElementById('searchInput').addEventListener('input',function(){render(this.value);});
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLb();});
document.addEventListener('keydown',e=>{
  if(document.getElementById('cmpView').classList.contains('show')){ if(e.key==='Escape')closeCompare(); return; }
  if(!document.getElementById('lightbox').classList.contains('show'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')navLb(-1);
  if(e.key==='ArrowRight')navLb(1);
});
init();
</script>
</body>
</html>
